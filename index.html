<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>School Homepage</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

       <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }
        .header-box {
            background-color: white;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .form-box {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
        }
    
    </style>
    
    
   
   
</head>
<body>

	<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Contact Us</a>
            <form class="d-flex">
                <input class="form-control me-2" type="text" placeholder="Search">
                <button class="btn btn-primary" type="button">Search</button>
            </form>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            
        


            <div class="col-md-7">
                <div class="header-box">
                    <h1>School Class Hours</h1>
                
                </div>

                <table class="table table-striped table-bordered bg-white text-center">
                    <thead>
                        <tr>
                            <th>Day</th>
                            <th>Class Hours</th>
                            <th>Uniform</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Monday</td>
                            <td>7:00AM-2:30PM</td>
                            <td>Regular Uniform</td>
                        </tr>
                        <tr>
                            <td>Tuesday</td>
                            <td>7:00AM-2:30PM</td>
                            <td>Regular Uniform</td>
                        </tr>
                        <tr>
                            <td>Wednesday</td>
                            <td>7:00AM-2:00PM</td>
                            <td>PE Uniform</td>
                        </tr>
                        <tr>
                            <td>Thursday</td>
                            <td>7:00AM-2:00PM</td>
                            <td>Regular Uniform</td>
                        </tr>
                        <tr>
                            <td>Friday</td>
                            <td>7:00AM-1:30PM</td>
                            <td>Eagle Uniform</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            
            <div class="col-md-5">
                <div class="form-box">
                    <h2 class="text-center mb-3">Contact Us</h2>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your full name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" class="form-control" placeholder="Enter subject" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="3" placeholder="Type your message here" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send Message</button>
                    </form>
                </div>
            </div>
	
   
</body>
</html>
